name: Keep Alive

on:
  workflow_dispatch:
  schedule:
    # Weekly, well inside GitHub's 60-day inactivity window for scheduled workflows
    - cron: '0 0 * * 0'

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      # Commits pushed with GITHUB_TOKEN do not count as repository activity,
      # but re-enabling a workflow through the API resets the inactivity timer.
      - name: Re-enable scheduled workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for wf in main.yml keep-alive.yml; do
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/$wf/enable"
            echo "Enabled $wf"
          done
